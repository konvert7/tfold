name: release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Rust format
        run: cargo fmt --check
      - name: Rust check
        run: cargo check --all-targets
      - name: Rust clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: jscpd
        run: bun run jscpd
      - name: Line endings
        run: bun run lf

  build:
    name: build (${{ matrix.package }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: linux-x64
            rust-target: x86_64-unknown-linux-gnu
            binary: tfold
          - os: macos-latest
            package: darwin-arm64
            rust-target: aarch64-apple-darwin
            binary: tfold
          - os: macos-15-intel
            package: darwin-x64
            rust-target: x86_64-apple-darwin
            binary: tfold
          - os: windows-latest
            package: win32-x64
            rust-target: x86_64-pc-windows-msvc
            binary: tfold.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install Rust target
        run: rustup target add ${{ matrix.rust-target }}
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.rust-target }}
      - name: Test
        run: cargo test --target ${{ matrix.rust-target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.rust-target }}
      - name: Stage and smoke the npm shim
        shell: bash
        run: |
          node npm/stage.mjs \
            --binary "target/${{ matrix.rust-target }}/release/${{ matrix.binary }}" \
            --version "0.0.0-ci"
      - name: Collect binary
        shell: bash
        run: |
          mkdir -p "dist/binaries/${{ matrix.package }}"
          cp "target/${{ matrix.rust-target }}/release/${{ matrix.binary }}" \
             "dist/binaries/${{ matrix.package }}/${{ matrix.binary }}"
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: tfold-${{ matrix.package }}
          path: dist/binaries/${{ matrix.package }}/${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: release
    needs: [lint, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest
      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install release tooling
        run: bun install --frozen-lockfile
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: tfold-*
          path: dist/downloaded
      - name: Reshape artifacts into dist/binaries
        shell: bash
        run: |
          mkdir -p dist/binaries
          for dir in dist/downloaded/tfold-*; do
            package="${dir#dist/downloaded/tfold-}"
            mkdir -p "dist/binaries/$package"
            cp "$dir"/* "dist/binaries/$package/"
            chmod +x "dist/binaries/$package/"* || true
          done
          find dist/binaries -type f -print
      - name: Authenticate with crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Release
        run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          TFOLD_SKIP_MISSING_NATIVE_PUBLISH: "1"
