[package]
name = "tfold"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A repository map that fits a token budget."
repository = "https://github.com/konvert7/treefold"
homepage = "https://github.com/konvert7/treefold"
license = "MIT"
readme = "README.md"
keywords = ["tree", "repository", "agent", "llm", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/npm", "/.github"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
ignore = "0.4.33"

[profile.release]
lto = true
codegen-units = 1
strip = true
